services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scanner_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-scanner}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scanner}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scanner}:${POSTGRES_PASSWORD:-scanner_dev_password}@database:5432/${POSTGRES_DB:-scanner}
      ALLOW_PRIVATE_NETWORK_TARGETS: ${ALLOW_PRIVATE_NETWORK_TARGETS:-false}
      ALLOW_LOCAL_DEV_TARGET: ${ALLOW_LOCAL_DEV_TARGET:-false}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      database: { condition: service_healthy }
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:80"]

volumes:
  pgdata:
