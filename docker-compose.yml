services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scanner_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-scanner}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scanner}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scanner}:${POSTGRES_PASSWORD:-scanner_dev_password}@database:5432/${POSTGRES_DB:-scanner}
      ALLOW_PRIVATE_NETWORK_TARGETS: ${ALLOW_PRIVATE_NETWORK_TARGETS:-false}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
    depends_on:
      database: { condition: service_healthy }
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:80"]

  # Optional lab target. Start with: docker compose --profile lab up --build
  # and set ALLOW_PRIVATE_NETWORK_TARGETS=true, then scan http://vulnerable-test-app:9000
  vulnerable-test-app:
    build: ./vulnerable-test-app
    profiles: ["lab"]
    ports: ["9000:9000"]

volumes:
  pgdata:
